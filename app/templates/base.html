<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SponsorPath{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">SP</span>
        <span>SponsorPath</span>
      </a>
      <div class="header-note">
        <span class="live-dot"></span>
        {% if request.session.get("user") %}
          <span>{{ request.session.get("user") }}</span>
          <form method="post" action="/logout"><button class="logout-button" type="submit">Sign out</button></form>
        {% else %}
          UK sponsorship search
        {% endif %}
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <span>SponsorPath</span>
      <span>Review every vacancy and document before applying.</span>
    </footer>
    <script src="{{ url_for('static', path='/app.js') }}"></script>
  </body>
</html>
